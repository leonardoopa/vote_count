services:
  contador:
    build: .
    ports:
      # BIND=127.0.0.1 (padrão): só esta máquina acessa.
      # Na VPS, use BIND=0.0.0.0 no .env para abrir ao público.
      - "${BIND:-127.0.0.1}:${PORTA:-8000}:8000"
    restart: unless-stopped
    read_only: true
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    environment:
      ANUNCIO_TEXTO: "${ANUNCIO_TEXTO:-}"
      ANUNCIO_LINK: "${ANUNCIO_LINK:-}"
      ANUNCIO_ROTULO: "${ANUNCIO_ROTULO:-}"
      ANUNCIO_IMAGEM: "${ANUNCIO_IMAGEM:-}"
      URL_PUBLICA: "${URL_PUBLICA:-}"
      BUSCAS_EXTRAS_POR_SEGUNDO: "${BUSCAS_EXTRAS_POR_SEGUNDO:-2}"
    volumes:
      - historico:/dados  # histórico da apuração: sobrevive a `docker compose down` (só `down -v` apaga)

volumes:
  historico:
